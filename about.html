<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>About Us</title>
  <link rel="stylesheet" href="about.css">
</head>
<body>

<div class="overlay">

  <!-- HEADER -->
  <header class="header">
    <img src="images/logo.png" alt="logo">
  </header>

  <!-- TOP SECTION (4 COLUMNS) -->
  <section class="grid grid-4">

    <div class="card">
      <h3>COMPANY PROFILE</h3>
      <div class="content text-block"></div>
      <div class="content image-block"></div>
    </div>

    <div class="card">
      <h3>QUALITY AGED LIQUOR</h3>
      <div class="stack">
        <div class="image-block"></div>
        <div class="image-block"></div>
        <div class="image-block"></div>
      </div>
    </div>

    <div class="card">
      <h3>BREWING PROCESS</h3>
      <div class="process-item"></div>
      <div class="process-item"></div>
      <div class="process-item"></div>
      <div class="process-item"></div>
    </div>

    <div class="card">
      <h3>CORE PRODUCTION REGION</h3>
      <div class="stack">
        <div class="image-block"></div>
        <div class="image-block"></div>
        <div class="image-block"></div>
      </div>
    </div>

  </section>

  <!-- BOTTOM SECTION (5 COLUMNS) -->
  <section class="grid grid-5">

    <div class="card">
      <h3>TIME-HONORED</h3>
      <div class="stack"></div>
    </div>

    <div class="card">
      <h3>BRAND HONORS</h3>
      <div class="stack"></div>
    </div>

    <div class="card">
      <h3>DISTRIBUTION NETWORK</h3>
      <div class="stack"></div>
    </div>

    <div class="card">
      <h3>BRAND PROMOTIONS</h3>
      <div class="stack"></div>
    </div>

    <div class="card">
      <h3>CULTURAL MARKETING</h3>
      <div class="stack"></div>
    </div>

  </section>

</div>

</body>
</html>
